apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: brickwall:0.1.0
          command: ["/app/bsp", "api"]
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: api-config
          dependsOn:
            - postgres
            - nats
            - redis
            - maildev
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  ports:
    - port: 8081
  selector:
    app: api
